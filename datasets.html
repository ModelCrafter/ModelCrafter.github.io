<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datasets | Youssef Khaled</title>

    <!-- SEO -->
    <meta name="description" content="Datasets curated and published by Youssef Khaled — chemical compounds, Arabic poetry, dream interpretation, and language corpora.">
    <meta property="og:title" content="Datasets | Youssef Khaled">
    <meta property="og:description" content="Datasets curated and published by Youssef Khaled.">
    <meta property="og:type" content="website">
    <meta name="robots" content="index, follow">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Datasets | Youssef Khaled">
    <meta name="twitter:description" content="Datasets curated and published by Youssef Khaled.">
    <link rel="canonical" href="https://modelcrafter.github.io/datasets.html">
    <meta property="og:url" content="https://modelcrafter.github.io/datasets.html">

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <style>
        body {
            background: #000000;
            color: var(--text-color);
            font-family: 'VT323', monospace;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* CONTENT */
        .content {
            position: relative;
            z-index: 10;
            padding-top: 100px;
            padding-bottom: 50px;
        }

        .page-title {
            text-align: center;
            font-size: 3rem;
            color: #e0e0e8;
            text-shadow: 0 0 30px rgba(100, 150, 255, 0.4);
            letter-spacing: 6px;
            margin: 2rem 0 3rem;
        }

        .datasets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .dataset-card {
            background: rgba(15, 15, 35, 0.6);
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-radius: 4px;
            padding: 24px;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
            text-decoration: none;
            display: block;
        }

        .dataset-card:hover {
            border-color: rgba(100, 150, 255, 0.8);
            box-shadow: 0 0 20px rgba(100, 150, 255, 0.3);
            transform: translateY(-5px);
        }

        .dataset-id {
            font-size: 0.9rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .dataset-name {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .dataset-size {
            font-size: 1rem;
            line-height: 1.6;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .page-title {
                font-size: 2rem;
                letter-spacing: 3px;
            }

            .datasets-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
                padding: 0 15px;
            }

            .dataset-card {
                padding: 16px;
            }

            .content {
                padding-top: 90px;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 1.5rem;
                letter-spacing: 2px;
                margin: 1.5rem 0 2rem;
            }

            .datasets-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 0 10px;
            }

            .dataset-card {
                padding: 12px;
            }

            .content {
                padding-top: 80px;
                padding-bottom: 30px;
            }
        }
    </style>
</head>
<body>
    <div id="space-container"></div>

    <header class="navbar">
        <a class="nav-home-btn" href="index.html">← HOME</a>
        <nav class="nav-links">
            <a class="nav-btn" href="projects.html">PROJECTS</a>
            <a class="nav-btn active" href="datasets.html">DATASETS</a>
            <a class="nav-btn" href="signal.html">SIGNAL</a>
            <a class="nav-btn" href="init.html">INIT</a>
        </nav>
    </header>

    <div class="content">
        <h1 class="page-title">DATASETS</h1>
        <div class="datasets-grid" id="datasetsContainer"></div>
    </div>

    <script src="data.js"></script>
    <script>
        const spaceContainer = document.getElementById('space-container');
        const datasetsContainer = document.getElementById('datasetsContainer');
        const bgStarCount = 200;

        function createBgStars() {
            for (let i = 0; i < bgStarCount; i++) {
                const star = document.createElement('div');
                star.className = 'star-bg';
                star.setAttribute('aria-hidden', 'true');
                const pos = { x: Math.random() * 100, y: Math.random() * 100 };
                const size = Math.random() * 1.5 + 0.3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = pos.x + '%';
                star.style.top = pos.y + '%';
                star.style.animationDelay = (Math.random() * 2.5) + 's';
                spaceContainer.appendChild(star);
            }
        }

        function createAsteroids() {
            const asteroidCount = 6;
            for (let i = 0; i < asteroidCount; i++) {
                const asteroid = document.createElement('div');
                asteroid.className = 'asteroid';
                asteroid.setAttribute('aria-hidden', 'true');
                const size = Math.random() * 6 + 2;
                asteroid.style.width = size + 'px';
                asteroid.style.height = size + 'px';
                asteroid.style.left = Math.random() * 100 + '%';
                asteroid.style.top = Math.random() * 100 + '%';
                asteroid.style.background = '#b4b4c8';
                spaceContainer.appendChild(asteroid);
            }
        }

        function renderDatasets() {
            datasetsContainer.innerHTML = '';
            datasetsData.forEach(dataset => {
                // Real <a href> card instead of a div + click listener.
                const card = document.createElement('a');
                card.className = 'dataset-card';
                card.href = dataset.link;
                card.innerHTML = `
                    <div class="dataset-id" style="color: ${dataset.color}; text-shadow: 0 0 5px ${dataset.color};">DATA_0${dataset.id}</div>
                    <h3 class="dataset-name" style="color: ${dataset.color}; text-shadow: 0 0 15px ${dataset.color};">${dataset.name}</h3>
                    <p class="dataset-size" style="color: ${dataset.color}; text-shadow: 0 0 10px ${dataset.color};">${dataset.size}</p>
                `;
                datasetsContainer.appendChild(card);
            });
        }

        createBgStars();
        createAsteroids();
        renderDatasets();
    </script>
</body>
</html>
