<body><div id="space-container"></div><header class="navbar"><a class="nav-btn" href="../index.html">BACK</a></header><main class="content"><div class="project-header"><div class="project-id">PROJECT_05</div><h1 class="project-title">Pixel Art VAE</h1><p class="project-meta">A disentangled Variational Autoencoder for high-fidelity pixel art generation &amp; latent interpretability</p><div class="project-tags"><span>Generative AI</span><span>VAE</span><span>Computer Vision</span><span>TensorFlow</span><span>Disentanglement</span></div></div><div class="readme-container"><div class="readme-content" id="readmeContent"></div></div><div style="max-width:900px;margin:0 auto;padding:0 20px;text-align:center"><a href="../projects.html" class="back-btn">&larr; Back to Projects</a></div></main>
<script>
const spaceContainer=document.getElementById('space-container');function createSpace(){for(let index=0;index<206;index++){const item=document.createElement('div');item.className=index<200?'star-bg':'asteroid';item.setAttribute('aria-hidden','true');const size=index<200?Math.random()*1.5+.3:Math.random()*6+2;item.style.width=size+'px';item.style.height=size+'px';item.style.left=Math.random()*100+'%';item.style.top=Math.random()*100+'%';if(index<200)item.style.animationDelay=Math.random()*2.5+'s';else item.style.background='#b4b4c8';spaceContainer.appendChild(item)}}
document.getElementById('readmeContent').innerHTML=`<h2>Overview</h2><p>Pixel Art VAE is a custom-built, <strong>disentangled Variational Autoencoder</strong> designed to generate and interpolate pixel-art tree assets - not just reconstruct them. The architecture was engineered around an <strong>interpretable latent space</strong> where each of 10 latent dimensions maps to a distinct visual trait such as color, trunk shape, canopy orientation, or fruit style.</p><h2>Why It's Interesting</h2><div class="highlight-grid"><div class="highlight-card"><div class="h-title">Patch-Based Semantics</div><div class="h-text">A custom <code>PatchExtractor</code> layer splits every image into 4 spatial patches, forcing localized understanding before fusion, verified through out-of-distribution composite tests.</div></div><div class="highlight-card"><div class="h-title">Grayscale + Palette Attention</div><div class="h-text">Structure is decoupled from color through grayscale bootstrapping and an attention-style palette hint, preventing muddy color averaging.</div></div><div class="highlight-card"><div class="h-title">Multi-Objective Loss</div><div class="h-text">MAE + Binary Cross-Entropy + SSIM work together for sharp, vibrant, structurally faithful pixel art.</div></div><div class="highlight-card"><div class="h-title">Enforced Disentanglement</div><div class="h-text">Monotonic beta-annealing (0 to 7.1) and <code>LatentDecorrelationRegularizer</code> penalize off-diagonal latent covariance.</div></div></div><h2>Architecture Snapshot</h2><table><tr><th>Component</th><th>Input &rarr; Output</th><th>Key Design</th></tr><tr><td>PatchExtractor</td><td>(16,16,3) &rarr; (4,8,8,1)</td><td>Grayscale + sigmoid adapter + brightness jitter</td></tr><tr><td>TimeDistributed Conv stack</td><td>(4,8,8,1) &rarr; (4,8,8,256)</td><td>Independent per-patch processing, 6 blocks</td></tr><tr><td>Factored Conv3D stack</td><td>(4,8,8,256) &rarr; (4,8,8,256)</td><td>Cross-patch fusion, 4 blocks</td></tr><tr><td>Latent heads</td><td>(256,) &rarr; (10) x 2</td><td>mu, log sigma2 + reparameterisation</td></tr><tr><td>Decoder</td><td>(10,) &rarr; (16,16,3)</td><td>Residual upsamplers, nearest-neighbor interpolation, sigmoid output</td></tr></table><h2>Interpretability Deep-Dive</h2><p>The full write-up covers covariance analysis across 1,024 held-out samples, UMAP topology mapping, latent interpolation, per-dimension traversals, and decoder Jacobian sensitivity analysis at the zero-vector.</p><h2>Key Findings</h2><p>The 10 dimensions resolve into structural, asset-generation, and chromatic/canopy families. Every claim is backed by Jacobian pixel-attribution maps, providing a mathematical breakdown of what the model learned.</p><h2>Tech Stack</h2><p>Built with <code>TensorFlow</code>, custom Keras layers (<code>PatchExtractor</code>, <code>LatentDecorrelationRegularizer</code>), <code>UMAP</code>, and a hand-computed Jacobian pipeline.</p><div class="kaggle-cta"><p>This page is a condensed overview. The full write-up includes every figure, the complete math derivation, and the experimentation journey.</p><a class="kaggle-btn" href="https://www.kaggle.com/writeups/m0delcrafter/VAE-disentanglement-journey" target="_blank" rel="noopener">Read the Full Write-Up on Kaggle &rarr;</a></div>`;createSpace();
</script></body></html>
