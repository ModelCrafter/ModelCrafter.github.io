			<h2>Overview</h2>
			<p>"Attention Is All You Need" landed in 2017. This is a full <strong>research-grade data investigation</strong> into how that one paper took over search engines, research labs, deep learning frameworks, and Kaggle notebooks. Four independent data sources, eleven cross-referenced figures, six sections: <code>Google Trends</code> &rarr; <code>arXiv</code> &rarr; <code>Meta Kaggle notebooks</code> &rarr; <code>Meta Kaggle community</code>.</p>
			<p>The goal was to <strong>prove, with independent public signals, exactly when and how the world changed</strong> - down to the year, framework, and subfield.</p>
			<h2>The Headline Numbers</h2><div class="stat-strip">
				<div class="stat-box"><div class="stat-num">+1,644%</div><div class="stat-label">Dataset growth 2019-21</div></div><div class="stat-box"><div class="stat-num">17,054</div><div class="stat-label">arXiv papers 2021+2022</div></div><div class="stat-box"><div class="stat-num">7M+</div><div class="stat-label">Kaggle notebook visits</div></div><div class="stat-box"><div class="stat-num">3.5M+</div><div class="stat-label">Dataset downloads</div></div><div class="stat-box"><div class="stat-num">8,971</div><div class="stat-label">Papers in 2022 alone</div></div><div class="stat-box"><div class="stat-num">11</div><div class="stat-label">Figures analyzed</div></div>
			</div>
			<h2>A Timeline Built Entirely From Data - Not Memory</h2><div class="timeline"><div class="timeline-item"><div class="timeline-year">2017</div><p>"Attention Is All You Need" submitted. Search interest: near zero. Kaggle notebooks tagged Transformer: none.</p></div><div class="timeline-item"><div class="timeline-year">2018-2019</div><p>BERT ships, TensorFlow-native. arXiv publications spike. Text Classification still dominates applied work.</p></div><div class="timeline-item"><div class="timeline-year">2020</div><p>COVID-19 dents public search interest, but notebook creation and dataset volume keep climbing.</p></div><div class="timeline-item"><div class="timeline-year">2021</div><p>The "silent" year: 8,083 papers, GPT-3 adoption, Hugging Face rising, PyTorch overtaking TensorFlow.</p></div><div class="timeline-item"><div class="timeline-year">2022</div><p>Search, papers, downloads, and forum activity surge at once - the Twilight of the Golden Age.</p></div></div>
			<h2>Findings That Flip the Obvious Narrative</h2><ul class="hook-list"><li>2021 looks quiet on Google Trends, but it is the year the applied community built what exploded publicly in 2022.</li><li>The 2021 dip in notebook views is not disengagement - thousands of observers became contributors.</li><li>TensorFlow did not lose because it got worse; one OpenAI framework choice for GPT reshaped an ecosystem.</li><li>A flat Kaggle signal turned out to be a labeling blind spot, not a lack of activity.</li></ul>
			<h2>What's Inside - Section by Section</h2><div class="section-grid"><div class="section-card"><h4>I - Public &amp; Research Attention</h4><p>Google Trends cross-referenced against arXiv publication volume, year by year.</p></div><div class="section-card"><h4>II - The Flourishing of Kernels</h4><p>Kaggle notebook growth, millions of views, and the TensorFlow to PyTorch shift.</p></div><div class="section-card"><h4>III - NLP Subfields</h4><p>Text Classification, Question Answering, and Text Generation across research and practice.</p></div><div class="section-card"><h4>IV - The Flourishing of Datasets</h4><p>A 1,644% dataset explosion and 3.5M+ downloads made the trends possible.</p></div><div class="section-card"><h4>V - The Kaggle Community</h4><p>Forum activity across NLP and Computer Vision, including the 2022 generative shift.</p></div><div class="section-card"><h4>VI - The Big Picture</h4><p>Search, research, application, and community pulled into one coherent story.</p></div></div>
			<blockquote>2021 was overlooked in Google Trends - but far from ordinary. Much of the explosive momentum of 2022 took root during that quiet year.</blockquote>
