<style>
html,body{overflow:hidden;}
body{background:#000;color:#e0e0e8;font-family:'VT323',monospace;}

.ch-skip:focus-visible{outline:2px solid #a8c5ff;outline-offset:3px;}

#scene{position:fixed;inset:0;z-index:10;}

/* ── FLOAT MESSAGE ── */
#float-msg{
  position:fixed;z-index:500;
  font-size:1rem;letter-spacing:1px;color:#d0e0ff;
  background:rgba(4,4,20,.93);
  border:1px solid rgba(100,150,255,.2);
  border-radius:5px;
  padding:8px 14px;
  backdrop-filter:blur(20px);
  white-space:pre-wrap;
  max-width:min(380px,86vw);
  pointer-events:none;
  opacity:0;transform:translateY(6px);
  transition:opacity .28s,transform .28s;
  text-shadow:0 0 8px rgba(100,150,255,.35);
  line-height:1.55;
}
#float-msg.show{opacity:1;transform:translateY(0);}
#float-bar{position:absolute;top:0;left:0;right:0;height:2px;border-radius:2px 2px 0 0;}

/* ══════════════════════════════════════
   BOTTOM CONSOLE
   ══════════════════════════════════════ */
#ch-console{
  position:fixed;
  bottom:20px;left:50%;
  transform:translateX(-50%);
  z-index:400;
  display:flex;flex-direction:column;align-items:center;
  gap:7px;
  pointer-events:auto;
  user-select:none;
}

/* chapter name label */
#ch-title-label{
  font-size:.72rem;letter-spacing:5px;
  color:rgba(180,210,255,.4);
  text-transform:uppercase;text-align:center;
  transition:color .6s;white-space:nowrap;
}

/* main pill */
#ch-bar{
  display:flex;align-items:center;gap:18px;
  padding:9px 22px;
  background:rgba(3,3,16,.92);
  border:1px solid rgba(255,255,255,.1);
  border-radius:44px;
  backdrop-filter:blur(24px);
  box-shadow:
    0 0 0 1px rgba(100,150,255,.06),
    0 6px 40px rgba(0,0,0,.7),
    inset 0 1px 0 rgba(255,255,255,.05);
}

/* gem row */
#ch-gems{display:flex;align-items:center;gap:18px;}

/* individual gem wrapper — NOT clickable */
.ch-gem-wrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:5px;
  cursor:pointer;
}

/* the dot itself */
.ch-gem{
  width:7px;height:7px;
  border-radius:50%;
  border:1px solid rgba(var(--cr),var(--cg),var(--cb),.32);
  transition:all .4s cubic-bezier(.4,0,.2,1);
  background:transparent;
}
.ch-gem-wrap.done .ch-gem{
  background:rgba(var(--cr),var(--cg),var(--cb),.2);
  border-color:rgba(var(--cr),var(--cg),var(--cb),.45);
}
/* active = glowing diamond */
.ch-gem-wrap.active .ch-gem{
  width:12px;height:12px;
  border-radius:2px;
  transform:rotate(45deg);
  background:rgba(var(--cr),var(--cg),var(--cb),.42);
  border-color:rgba(var(--cr),var(--cg),var(--cb),.95);
  box-shadow:
    0 0 12px rgba(var(--cr),var(--cg),var(--cb),.55),
    0 0 28px rgba(var(--cr),var(--cg),var(--cb),.22);
  animation:gem-pulse 2.4s ease-in-out infinite;
}
@keyframes gem-pulse{
  0%,100%{box-shadow:0 0 10px rgba(var(--cr),var(--cg),var(--cb),.45),0 0 22px rgba(var(--cr),var(--cg),var(--cb),.18);}
  50%    {box-shadow:0 0 20px rgba(var(--cr),var(--cg),var(--cb),.8), 0 0 40px rgba(var(--cr),var(--cg),var(--cb),.32);}
}

/* divider */
.ch-divider{width:1px;height:18px;background:rgba(255,255,255,.09);margin:0 2px;}

  border:1px solid rgba(255,185,55,.55);
  color:rgba(255,205,90,.92);

  font-size:.95rem;font-family:'VT323',monospace;
  cursor:pointer;letter-spacing:2px;
  text-transform:uppercase;border-radius:22px;
  text-shadow:0 0 8px rgba(255,185,55,.4);
  box-shadow:0 0 10px rgba(255,175,40,.12);
  transition:all .35s;white-space:nowrap;
  text-decoration:none;display:inline-block;
}
.ch-skip:hover{
  background:rgba(255,175,40,.14);
  border-color:rgba(255,200,80,.9);
  color:#fff;
  box-shadow:0 0 18px rgba(255,175,40,.4),0 0 40px rgba(255,175,40,.12);
  text-shadow:0 0 12px rgba(255,200,80,.8);
  transform:scale(1.06);
}

/* ── CHAPTER OVERLAY ── */
#chapter-overlay{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;}

<script>
/* ════════════════════════════════════════════
   CHAPTERS
   — waypoints max y = 76% so they never go
     behind the bottom console (~100px)
   ════════════════════════════════════════════ */
const CHAPTERS = [
  {
    era:'CHAPTER_01', title:'THE-FIRST-SIGNAL', sub:'2019 — 2020',
    theme:[30,15,105],
    waypoints:[
      {type:'neutron',pos:[18,22],title:'THE SPARK',      color:[130,60,255], msg:'Youssef Khaled was a boy fast approaching his fourteenth birthday, owning a phone and a small, run-down computer.\nOne day, he overheard his father, who worked as an engineer, mentioning that he had a friend capable of hacking into other phones and spying on them.\nThe idea completely captivated Youssef, so he kept asking his father about the nature of this thing and how it worked.\nHowever, his father didnt pay much attention and merely gave him random, dismissive answers.\nDriven by curiosity, the boy went ahead and opened his dilapidated computer, turned to Google, and typed into the search bar: How to hack a phone...'},
      {type:'enzyme',  pos:[55,15],title:'THE GATEWAY',        color:[150,220,255],msg:'After searching for a very long time, he found almost nothing useful, except for downloading Kali Linux, which he did not even know the nature of. Furthermore, his own computer was not powerful enough to run it. So, he kept searching for a program that could work on a phone until he downloaded Termux\nand the journey began right from there...'},
      {type:'sun',      pos:[78,30],title:'FIRST CODE', color:[255,160,60], msg:'The boy became deeply attached to this, even abandoning his favorite game, chess.\nHe kept trying to hack phones to no avail, watching countless videos on YouTube.\nThen, by chance, he came across a channel explaining the Batch Script language.\nHe started learning it, and fortune smiled upon him.\nBefore turning fifteen, he created his very first calculator using it, which felt like a revolutionary invention to him.'},
      {type:'planet',   pos:[60,52],title:'MILESTONE',color:[255,255,255], msg:'Then came his fifteenth year, with the boy having gained a slight understanding of the Batch Script language.'},
      ]
  },
  {
    era:'CHAPTER_02', title:'ERA-OF-DRIFTING', sub:'2020 — 2022',
    theme:[10,60,145],
    waypoints:[
      /* ── repositioned: max y = 74 ── */
      {type:'blackhole',pos:[80,20],title:'THE FADE',  color:[255,120,80], msg:'The boy kept drifting and learning without a tangible, clear goal, until his spark and inner fire began to fade, especially since using the phone was uncomfortable.\nHe remained in this state until he completely stopped learning and neglected the whole matter.'},
      {type:'planet',   pos:[30,36],title:'DRIFTING',  color:[255,255,255], msg:'The boy left the matter behind and occupied himself with his studies, thinking that the whole thing was unrewarding.\nHe remained like this, without any plan, just drifting with no one to guide him or answer his questions.\nEvery month or two, he would still type something into Termux to no avail.\nHe continued in this manner until his sixteenth year knocked on the door and entered, bringing with it a brand new dawn.'},
      {type:'sun',  pos:[65,52],title:'REBOOT',        color:[160,230,255],msg:'During the summer vacation, I grew bored of playing chess so much, so I opened YouTube and kept searching for something that would make me a hacker extremely fast.\nAfter dozens of videos, I found a video that changed my life, which was learning "Python for hacking."\nBecause of my weak English language at the time, I couldnt watch the videos, so I searched and typed: Python...'},
      {type:'neutron',pos:[20,66],title:'NEW CORE',        color:[170,90,255], msg:'By good fortune and success, I found out that my father had bought us a new laptop, which was absolutely mesmerizing to me.\nFrom the very third day, I kept searching heavily for Python, coming across many misleading people and many who were simply wrong.\nThe summary of my research was that I found a vast number of people saying: "You must learn C++ before Python."\nAlso, because I had no one to ask, I dived into that language, downloaded the Code::Blocks program, and began my journey with cout << "Hello World!";...'},
      {type:'enzyme',   pos:[72,70],title:'GAME LOOP',     color:[100,150,255],msg:'I kept learning for a long time and reached loops and continued, but I grew tired of its syntax.\nOnce I started developing a programming awareness, even if slight, I researched and found that C++ was used only for the Unreal game engine—according to my research—and since I was truly passionate about games, I continued learning for a bit and downloaded Unreal.\nUnfortunately, with this laptop, working on it was impossible.\nSo I sat searching for a lightweight engine and found Godot, which I liked very, very much; it was simple and it worked, despite the difficulty, but it worked.\nHowever, I faced the obstacle of GDScript, so I left C++ and learned it, as games were still part of my passion, and I continued my way into GDScript and built a simple game.'},
      {type:'planet',   pos:[61,74],title:'MILESTONE',     color:[255,255,255],msg:'Then a new year arrived, and I turned 17 years old.'},

    ]
  },
  {
    era:'CHAPTER_03', title:'EVENT HORIZON', sub:'2022 — 2024',
    theme:[90,15,65],
    waypoints:[
      {type:'blackhole',pos:[20,22],title:'THE WALL',  color:[200,80,200], msg:'I drifted and became deeply in love with the matter, and I was actually on the verge of making a game of my own.\nHowever, I hit a giant wall: how would I get the assets, graphics, characters, and so on?\nSo I remained distracted, taking open-source assets while my hands were helpless, even though my mind was producing and overflowing with a flood of ideas and games that I wanted to create.\nAs a result, I left that behind as well and moved away from Godot, staying at a distance.\nBut this time, I didnt snap out of it after a year; instead, I woke up incredibly fast..'},
      {type:'neutron',  pos:[62,16],title:'BIG BANG',  color:[180,240,180],msg:'I began to feel frustrated, but I had started to understand the true nature of programming, and my heart was full of passion and infatuation with it, so it was hard for me to just leave it and neglect it.\nI dusted myself off, stood up, and immediately started a Python learning course, less than a month after the Godot setback.\nThanks to my knowledge of C++, Python felt incredibly easy and simple to me.\nI even struggled to grasp loops in Python, so I went back to a C++ video to understand them because it was deeper, and I absolutely hate superficiality.\nFrom this very point, the Big Bang of my real journey began.'},
      {type:'blackhole',      pos:[76,40],title:'DARKNESS',  color:[255,180,40], msg:'I did not know how to classify this year. Should I mark it as a white planet because it was a new year, as I usually do? Or should I mark it as a neutron star because it was a pivotal, turning-point year in my programming journey? Or should I mark it as a black hole because it was a terrible year in my academic life?\nIn the end, I decided to label it a black hole for what we are about to discuss.\nAt that point, I had reached the absolute peak of my passion; I was completely infatuated with Python and abandoned almost everything else—even going out and playing.\nI did nothing but learn, excel in it, and the like.\nIn Egypt, this was that crucial, make-or-break year: Thanaweya Amma—the year you must secure a high score to get into the Faculty of Engineering.\nI was capable of getting the score and I could have done it, but Python was my entire mind, so I did not achieve that high score.\nHere lies the black hole.\nThe social pressure began to weigh on me, and I left programming and abandoned everything.\nI was truly heartbroken, and it was the beginning of my 18th year...'},
      {type:'enzyme',   pos:[38,58],title:'RESURGENCE',  color:[120,160,255],msg:'After entering the Faculty of Arts, which is completely far removed from programming and mathematics, the world looked pitch black in my eyes.\nCould this clever boy really end up here? Could this researcher, who wanted to change the world, finish his journey here?\nI found no answers, and I lived with heavy social pressure for a long time, as sadness completely took over, until... a friend said to me: "I never expected you would end up like this; I always saw you as an engineer since childhood," and there was sadness for my sake in his eyes.\nThat was the exact moment I returned home immediately, opened my laptop, and resumed learning Python, until I completely finished it as well...'},
      {type:'planet', pos:[75,72],title:'MILESTONE',  color:[255,255,255], msg:'My 19th year knocked on my door, and before it arrived, I had been lost in a state of confusion, doing nothing but solving programming problems, studying for college, and passing with good grades just to prove that I could succeed in both fields, all while playing chess and raising my rating.\nThen, one day, I came across an advertisement for the book "Hands-On Machine Learning with Scikit-Learn, Keras, and TensorFlow."\nAnd right from there, the most important stage of all began.'},
    ]
  },
  {
    era:'CHAPTER_04', title:'ERA OF ASTERY', sub:'2024 — NOW',
    theme:[0,80,55],
    waypoints:[
      {type:'neutron',   pos:[22,28],title:'BLACK BOX',  color:[60,240,160], msg:'I actually bought the book, and when it arrived, I found that it was a giant—a massive reference manual.\nHowever, this only excited me because I knew that I wouldn’t be dealing with this field superficially, which is exactly what I love and adore.\nI started reading and diving deep, chapter by chapter, and managed to finish nearly four chapters.\nOf course, the models and components were like a black box to me; although I built projects—even if they were small—and made things and understood them, what was happening under the hood was completely missing.\nSo, I decided to jump straight into deep learning, thinking it would explain things from beneath the surface, but I discovered that it explained the absolute fundamentals of the models instead.\nYet, the multiplication, the matrices, and everything like that still remained a black box...'},
      {type:'sun', pos:[66,20],title:'UNDER THE HOOD',  color:[140,70,255], msg:'I went down to our local book market and bought reference books in linear algebra, then returned home.\nThis was the definitive turning point; I went back home and learned almost the entire foundation thoroughly from professors in the Faculty of Sciences mathematics department and the Faculty of Engineering.\nOnce my English improved, especially my reading skills, I looked forward to a major and important reference manual.\nI kept searching until I found Gilbert Strang’s book, and from there, I mastered many of its chapters and deeply understood its most critical sections.\nWhat I truly loved about Strang was that he doesn’t waste time on tedious proof details, and from that point on, I understood everything and became utterly infatuated with programming with my own hands at a low level, rather than just using model.fit()...'},
      {type:'planet',  pos:[80,46],title:'MILESTONE',  color:[255,255,255],msg:'Once I understood linear algebra intensely and achieved true mastery in it—while my passion still drives me to finish all the remaining chapters in Strang’s book—my 20th year knocked on my door.'},
      
      {type:'molecule', pos:[44,62],title:'THE CRAFT',  color:[255,200,100],msg:'I began mastering the craft, striving to understand everything alongside its mathematical equations.\nI was no longer satisfied with just writing import tensorflow or import sklearn; instead, I wanted to comprehend exactly how these algorithms work under the hood and what the mathematics behind them truly meant.\nI kept pushing forward this way and built dozens of projects, but the ones you see showcased here are only those that demanded deep time and effort—the ones truly worthy of reflecting my real capabilities.\nI worked heavily on tabular data and competed in hackathons on Zindi, but to me, none of that felt unique enough to showcase.\nI chose to display only the work that genuinely makes the eyes light up and carries a real, profound challenge.'},
      {type:'sun',  pos:[55,48],title:'THE MENTOR',  color:[160,240,255],msg:'And then an opportunity came my way here in Egypt, where I joined a local educational center as a Python instructor.\nI actually ended up teaching a lot of young students, some of whom were the exact same age as me, and those were truly among the happiest days of my life.\nI dedicated myself to it for a long time, but God willed that my journey there would come to an end.'},
      
      {type:'molecule',     pos:[18,74],title:'PRODUCTION READY',  color:[255,140,40], msg:'And now, right before stepping into my 21st year, my passion has intensified more than ever.\nI am currently focused on mastering three distinct domains: I am diving into FastAPI and am still at the very beginning of its tracks.\nI am also mastering Calculus to solidify my mathematical depth.\nFinally, I have completed nearly 90% of my pipeline with MLflow, DVC, and Dagshub.\nI am now actively looking forward to an opportunity that will become my next major station—a place where I can squeeze every ounce of my mind, where I can improve the ecosystem, and where the company and I can grow and learn together.'},
    ]
  },
];

/* ── CANVAS ── */
const cv  = document.getElementById('scene');
const ctx = cv.getContext('2d');
let W, H, animT = 0, stars = [];

/* ── STATE ── */
let currentChapter = 0;
let WAYPOINTS      = CHAPTERS[0].waypoints;

/* ── GLITCH ── */
const G={active:false,phase:'none',timer:0,intensity:0,next:-1,DUR:{buildup:22,heavy:38,flash:14,reveal:28,settle:22}};

/* ── SHIP ── */
const ship={x:0,y:0,angle:0,trail:[],tT:0,travelling:false,flightT:0,fromX:0,fromY:0,cpX:0,cpY:0,toX:0,toY:0,orbiting:false,orbitCx:0,orbitCy:0,orbitR:0,orbitAngle:0,stationIdx:-1,waitTimer:0,waitDuration:200,msgShown:false};

/* ── SMART DWELL ── */
function calcWait(msg){return Math.round(Math.min(440,Math.max(150,190+Math.max(0,msg.length-55)*.85)));}

/* ── HOVER ── */
const mouse={x:-9999,y:-9999};
let hoveredWP=null,hoverActive=false,hoverTimer=null;
cv.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
cv.addEventListener('mouseleave',()=>{mouse.x=-9999;mouse.y=-9999;});

function checkHover(){
  if(G.active){hoveredWP=null;cv.style.cursor='default';return;}
  let found=null;
  WAYPOINTS.forEach(wp=>{const{x,y}=wpos(wp);if(Math.hypot(mouse.x-x,mouse.y-y)<30)found=wp;});
  cv.style.cursor=found?'pointer':'default';
  if(found===hoveredWP)return;
  hoveredWP=found;clearTimeout(hoverTimer);
  if(found){hoverActive=true;clearTimeout(msgTimeout);_renderMsg(found);}
  else{hoverTimer=setTimeout(()=>{hoverActive=false;if(ship.stationIdx===-1||!ship.msgShown)floatEl.classList.remove('show');},350);}
}

/* ── RESIZE ── */
function resize(){
  W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
  stars=Array.from({length:480},()=>{const l=Math.random();return{x:Math.random()*W,y:Math.random()*H,r:l*1.3+.2,a:l*.45+.1,ph:Math.random()*Math.PI*2,sp:Math.random()*.005+.002,c:['#C0D0FF','#FFE9C8','#D8CCFF','#C0FFE9'][0|Math.random()*4],vx:(Math.random()-.5)*.06*(l+.2),vy:.012+l*.045,layer:l};});
}
window.addEventListener('resize',resize);resize();

/* ── HELPERS ── */
function clamp(v){return Math.min(255,Math.max(0,v));}
function wpos(wp){return{x:wp.pos[0]/100*W,y:wp.pos[1]/100*H};}
function bez(x1,y1,cx,cy,x2,y2,t){const mt=1-t;return{x:mt*mt*x1+2*mt*t*cx+t*t*x2,y:mt*mt*y1+2*mt*t*cy+t*t*y2};}
function bezTan(x1,y1,cx,cy,x2,y2,t){const mt=1-t;return{dx:2*mt*(cx-x1)+2*t*(x2-cx),dy:2*mt*(cy-y1)+2*t*(y2-cy)};}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

/* ── STARS ── */
function updateStars(){const w=G.active?1+G.intensity*8:1;stars.forEach(s=>{s.x+=s.vx*w;s.y+=s.vy*w;if(s.y>H+2){s.y=-2;s.x=Math.random()*W;}if(s.x<-2)s.x=W+2;if(s.x>W+2)s.x=-2;});}

/* ── BACKGROUND ── */
function drawBg(){
  const[tr,tg,tb]=CHAPTERS[currentChapter].theme;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  [[.12,.22,W*.36,`rgba(${tr},${tg},${tb},.09)`],[.74,.66,W*.28,`rgba(${0|tr*.4},${0|tg*.6},${clamp(tb+60)},.08)`],[.46,.84,W*.22,`rgba(${clamp(tr+60)},${0|tg*.3},${0|tb*.8},.07)`],[.86,.16,W*.18,`rgba(${0|tr*.2},${clamp(tg+40)},${0|tb*.5},.07)`]].forEach(([nx,ny,nr,nc])=>{const g=ctx.createRadialGradient(nx*W,ny*H,0,nx*W,ny*H,nr);g.addColorStop(0,nc);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(nx*W,ny*H,nr,0,Math.PI*2);ctx.fill();});
  stars.forEach(s=>{const tw=Math.sin(animT*s.sp+s.ph)*.3+.7,st=G.active?1+G.intensity*4*s.layer:1;ctx.save();ctx.translate(s.x,s.y);ctx.globalAlpha=s.a*tw;ctx.fillStyle=s.c;ctx.beginPath();if(st>1.2){ctx.save();ctx.scale(1,st);ctx.arc(0,0,s.r,0,Math.PI*2);ctx.restore();}else ctx.arc(0,0,s.r,0,Math.PI*2);ctx.fill();ctx.restore();});
  ctx.globalAlpha=1;
}

/* ── PATHS ── */

function drawShip(){const{x,y,angle}=ship;ship.trail.unshift({x,y});if(ship.trail.length>55)ship.trail.pop();ship.trail.forEach((tp,i)=>{const p=1-i/ship.trail.length;ctx.beginPath();ctx.arc(tp.x,tp.y,1.5*p,0,Math.PI*2);ctx.fillStyle=`rgba(130,195,255,${p*.32})`;ctx.fill();});ctx.save();ctx.translate(x,y);ctx.rotate(angle);ship.tT+=.2;const fl=ship.travelling?10+Math.sin(ship.tT)*4:4+Math.sin(ship.tT)*1.8;const fb=ctx.createRadialGradient(0,8,0,0,8,fl+8);fb.addColorStop(0,'rgba(80,155,255,.18)');fb.addColorStop(1,'transparent');ctx.fillStyle=fb;ctx.beginPath();ctx.arc(0,8,fl+8,0,Math.PI*2);ctx.fill();const fg=ctx.createLinearGradient(0,6,0,fl+11);fg.addColorStop(0,'rgba(255,255,255,.95)');fg.addColorStop(.2,'rgba(175,215,255,.85)');fg.addColorStop(.6,'rgba(60,135,255,.4)');fg.addColorStop(1,'transparent');ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-2.8,8);ctx.lineTo(0,8+fl);ctx.lineTo(2.8,8);ctx.closePath();ctx.fill();[[-5,7],[5,7]].forEach(([ox,oy])=>{const j=ctx.createLinearGradient(0,oy,0,oy+fl*.4);j.addColorStop(0,'rgba(140,205,255,.55)');j.addColorStop(1,'transparent');ctx.fillStyle=j;ctx.beginPath();ctx.moveTo(ox-1,oy);ctx.lineTo(ox,oy+fl*.4);ctx.lineTo(ox+1,oy);ctx.closePath();ctx.fill();});const hull=ctx.createLinearGradient(-8,-17,7,14);hull.addColorStop(0,'#E0EEFF');hull.addColorStop(.28,'#7AACD8');hull.addColorStop(.65,'#2C6098');hull.addColorStop(1,'#0A2540');ctx.fillStyle=hull;ctx.beginPath();ctx.moveTo(0,-19);ctx.bezierCurveTo(4,-16,8,0,8,7);ctx.lineTo(6,11);ctx.lineTo(-6,11);ctx.lineTo(-8,7);ctx.bezierCurveTo(-8,0,-4,-16,0,-19);ctx.closePath();ctx.fill();const wg=ctx.createLinearGradient(-20,7,20,14);wg.addColorStop(0,'#091E3E');wg.addColorStop(.5,'#163860');wg.addColorStop(1,'#091E3E');ctx.fillStyle=wg;ctx.beginPath();ctx.moveTo(-8,5);ctx.lineTo(-22,14);ctx.lineTo(-20,17);ctx.lineTo(-6,11);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(8,5);ctx.lineTo(22,14);ctx.lineTo(20,17);ctx.lineTo(6,11);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(100,185,255,.14)';ctx.beginPath();ctx.moveTo(-9,7);ctx.lineTo(-20,13);ctx.lineTo(-18,16);ctx.lineTo(-7,10);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(9,7);ctx.lineTo(20,13);ctx.lineTo(18,16);ctx.lineTo(7,10);ctx.closePath();ctx.fill();ctx.fillStyle='#091E3E';ctx.beginPath();ctx.moveTo(-6,10);ctx.lineTo(-10,19);ctx.lineTo(-4,15);ctx.lineTo(-4,12);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(6,10);ctx.lineTo(10,19);ctx.lineTo(4,15);ctx.lineTo(4,12);ctx.closePath();ctx.fill();const cp=ctx.createRadialGradient(-2.5,-7,1,0,-5,8);cp.addColorStop(0,'rgba(255,255,255,.88)');cp.addColorStop(.4,'rgba(155,225,255,.5)');cp.addColorStop(1,'rgba(5,40,110,.06)');ctx.fillStyle=cp;ctx.beginPath();ctx.moveTo(0,-17);ctx.bezierCurveTo(4,-13,5.5,-3,5,-1);ctx.lineTo(-5,-1);ctx.bezierCurveTo(-5.5,-3,-4,-13,0,-17);ctx.closePath();ctx.fill();if(Math.floor(animT/25)%2===0){ctx.fillStyle='rgba(255,55,55,.8)';ctx.beginPath();ctx.arc(-22,15,1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(65,240,85,.8)';ctx.beginPath();ctx.arc(22,15,1.5,0,Math.PI*2);ctx.fill();}ctx.restore();}

/* ════════════════════════════════════════════
   GLITCH
   ════════════════════════════════════════════ */
function triggerGlitch(idx){if(G.active)return;G.active=true;G.phase='buildup';G.timer=0;G.intensity=0;G.next=idx;}

function updateGlitch(){
  if(!G.active)return;G.timer++;const D=G.DUR;
  if(G.phase==='buildup'){G.intensity=(G.timer/D.buildup)*.45;if(G.timer>=D.buildup){G.phase='heavy';G.timer=0;}}
  else if(G.phase==='heavy'){G.intensity=.45+(G.timer/D.heavy)*.55;if(G.timer>=D.heavy){G.phase='flash';G.timer=0;switchChapter();}}
  else if(G.phase==='flash'){G.intensity=1;if(G.timer>=D.flash){G.phase='reveal';G.timer=0;}}
  else if(G.phase==='reveal'){G.intensity=1-(G.timer/D.reveal)*.65;if(G.timer>=D.reveal){G.phase='settle';G.timer=0;}}
  else if(G.phase==='settle'){G.intensity=.35*(1-G.timer/D.settle);if(G.timer>=D.settle){G.active=false;G.intensity=0;G.phase='none';}}
}

function switchChapter(){
  currentChapter=G.next%CHAPTERS.length;
  WAYPOINTS=CHAPTERS[currentChapter].waypoints;
  journeyIdx=0;hoveredWP=null;hoverActive=false;
  ship.stationIdx=-1;ship.orbiting=false;ship.travelling=false;ship.trail=[];
  const first=wpos(WAYPOINTS[0]);
  ship.x=first.x-80;ship.y=first.y+40;ship.angle=Math.PI*.5;
  startLeg(ship.x,ship.y,0,0);
  showChapterTitle(CHAPTERS[currentChapter]);
  buildConsole();
}

function renderGlitch(){
  const iv=G.intensity;if(iv<=0)return;
  const nS=Math.floor(iv*10)+1;
  for(let i=0;i<nS;i++){const gy=Math.floor(Math.random()*H),gh=Math.floor(Math.random()*7+1);if(gy+gh>=H)continue;const gx=Math.round((Math.random()-.5)*iv*55);if(!gx)continue;try{const s=ctx.getImageData(0,gy,W,gh);ctx.putImageData(s,gx,gy);}catch(e){}}
  ctx.save();ctx.globalCompositeOperation='screen';const ab=iv*9;ctx.globalAlpha=iv*.07;ctx.fillStyle='#ff2200';ctx.fillRect(-ab,0,W+ab*2,H);ctx.fillStyle='#00ddff';ctx.fillRect(ab,0,W-ab*2,H);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=iv*.13;ctx.fillStyle='#000';for(let sy=0;sy<H;sy+=3)ctx.fillRect(0,sy,W,1);ctx.globalAlpha=1;const nP=Math.floor(iv*160);for(let i=0;i<nP;i++){const px=Math.random()*W,py=Math.random()*H;ctx.fillStyle=Math.random()>.5?'#fff':`hsl(${Math.random()*360},100%,70%)`;ctx.fillRect(px,py,1.5,1.5);}if(Math.random()<iv*.5){const ty=Math.floor(Math.random()*H);ctx.globalAlpha=.6;ctx.fillStyle=`hsl(${180+Math.random()*60},100%,75%)`;ctx.fillRect(0,ty,W,1);}if(G.phase==='flash'){const ft=G.timer/G.DUR.flash,fa=ft<.5?ft*2:(1-ft)*2;ctx.globalAlpha=fa*.92;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);}ctx.globalAlpha=1;ctx.restore();
}

/* ════════════════════════════════════════════
   MESSAGE
   ════════════════════════════════════════════ */
const floatEl=document.getElementById('float-msg');
const floatTxt=document.getElementById('float-txt');
const floatBar=document.getElementById('float-bar');
let msgTimeout=null;

function _renderMsg(wp){
  const[R,Gv,B]=wp.color;
  floatBar.style.background=`rgba(${R},${Gv},${B},.85)`;
  floatEl.style.borderColor=`rgba(${R},${Gv},${B},.2)`;
  floatTxt.textContent=wp.msg;
  const{x,y}=wpos(wp),MARGIN=14;
  floatEl.style.left=Math.max(6,Math.min(window.innerWidth-400,x-140))+'px';
  if(y-80-60-MARGIN<0){floatEl.style.top=(y+MARGIN)+'px';floatEl.style.bottom='auto';}
  else{floatEl.style.top='auto';floatEl.style.bottom=(window.innerHeight-y+MARGIN)+'px';}
  floatEl.classList.add('show');
}
function showMsg(wp){
  if(hoverActive)return;
  clearTimeout(msgTimeout);_renderMsg(wp);
  msgTimeout=setTimeout(()=>{if(!hoverActive)floatEl.classList.remove('show');},ship.waitDuration/60*1000-200);
}

/* ── CHAPTER TITLE ── */
let chTOut=null;
function showChapterTitle(ch){
  const ov=document.getElementById('chapter-overlay');
  document.getElementById('chapter-era').textContent=ch.era;
  document.getElementById('chapter-title').textContent=ch.title;
  document.getElementById('chapter-sub').textContent=ch.sub;
  ov.classList.add('show');clearTimeout(chTOut);
  chTOut=setTimeout(()=>ov.classList.remove('show'),2800);
}

/* ════════════════════════════════════════════
   CONSOLE  — progress indicator only (no click)
   ════════════════════════════════════════════ */
function buildConsole(){
  const gemsEl=document.getElementById('ch-gems');
  gemsEl.innerHTML='';

  CHAPTERS.forEach((ch,i)=>{
    const[r,g,b]=ch.waypoints[0].color;
    const wrap=document.createElement('div');
    wrap.className='ch-gem-wrap'+(i===currentChapter?' active':i<currentChapter?' done':'');
    wrap.style.setProperty('--cr',r);
    wrap.style.setProperty('--cg',g);
    wrap.style.setProperty('--cb',b);
    const gem=document.createElement('div');
    gem.className='ch-gem';
    wrap.appendChild(gem);
    wrap.addEventListener('click', ()=>triggerGlitch(i));
    gemsEl.appendChild(wrap);
  });

  /* update label with current chapter name + color */
  const ch=CHAPTERS[currentChapter];
  const lbl=document.getElementById('ch-title-label');
  const[r,g,b]=ch.waypoints[0].color;
  lbl.textContent=`— ${ch.title} —`;
  lbl.style.color=`rgba(${r},${g},${b},.52)`;
}
buildConsole();

/* ════════════════════════════════════════════
   JOURNEY
   ════════════════════════════════════════════ */
let journeyIdx=0;

function startLeg(fromX,fromY,toIdx,legIdx){
  const b=wpos(WAYPOINTS[toIdx]);
  ship.travelling=true;ship.orbiting=false;ship.flightT=0;
  ship.fromX=fromX;ship.fromY=fromY;ship.toX=b.x;ship.toY=b.y;
  const mid={x:(fromX+b.x)/2,y:(fromY+b.y)/2};
  const dx=b.x-fromX,dy=b.y-fromY;
  const bulge=((legIdx||0)%2===0?1:-1)*Math.min(W,H)*.13;
  const len=Math.sqrt(dx*dx+dy*dy)+.001;
  ship.cpX=mid.x-(dy/len)*bulge;ship.cpY=mid.y+(dx/len)*bulge;
}

function arriveAt(idx){
  const wp=WAYPOINTS[idx];const{x,y}=wpos(wp);
  ship.travelling=false;ship.orbiting=true;
  ship.orbitCx=x;ship.orbitCy=y;
  ship.orbitR=wp.type==='blackhole'?26:wp.type==='neutron'?22:24;
  ship.orbitAngle=Math.atan2(ship.y-y,ship.x-x);
  ship.stationIdx=idx;ship.waitTimer=0;ship.msgShown=false;
  ship.waitDuration=calcWait(wp.msg);
}

(function boot(){
  const first=wpos(WAYPOINTS[0]);
  ship.x=first.x-80;ship.y=first.y+40;ship.angle=Math.PI*.5;
  journeyIdx=0;startLeg(ship.x,ship.y,0,0);
  showChapterTitle(CHAPTERS[0]);
})();

/* ════════════════════════════════════════════
   MAIN LOOP
   ════════════════════════════════════════════ */
function loop(){
  requestAnimationFrame(loop);animT++;
  updateStars();updateGlitch();checkHover();
  const frozen=G.active&&(G.phase==='buildup'||G.phase==='heavy'||G.phase==='flash');
  if(!frozen){
    if(ship.travelling){
      ship.flightT=Math.min(ship.flightT+.0025,1);
      const et=ease(ship.flightT);
      const pos=bez(ship.fromX,ship.fromY,ship.cpX,ship.cpY,ship.toX,ship.toY,et);
      const tan=bezTan(ship.fromX,ship.fromY,ship.cpX,ship.cpY,ship.toX,ship.toY,Math.min(et,.999));
      const tA=Math.atan2(tan.dy,tan.dx)+Math.PI/2;
      let da=tA-ship.angle;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      ship.angle+=da*.1;ship.x=pos.x;ship.y=pos.y;
      if(ship.flightT>=1)arriveAt(journeyIdx);
    } else if(ship.orbiting){
      ship.orbitAngle+=.022;
      ship.x=ship.orbitCx+Math.cos(ship.orbitAngle)*ship.orbitR;
      ship.y=ship.orbitCy+Math.sin(ship.orbitAngle)*ship.orbitR*.4;
      ship.angle=ship.orbitAngle+Math.PI/2;
      if(!ship.msgShown){showMsg(WAYPOINTS[ship.stationIdx]);ship.msgShown=true;}
      ship.waitTimer++;
      if(ship.waitTimer>=ship.waitDuration){
        floatEl.classList.remove('show');
        if(journeyIdx===WAYPOINTS.length-1){
          ship.orbiting=false;ship.stationIdx=-1;
          triggerGlitch((currentChapter+1)%CHAPTERS.length);
        } else {
          const fx=ship.x,fy=ship.y,fl=journeyIdx;
          journeyIdx++;ship.stationIdx=-1;ship.orbiting=false;
          startLeg(fx,fy,journeyIdx,fl);
        }
      }
    }
  }
  const shX=G.active?(Math.random()-.5)*G.intensity*14:0;
  const shY=G.active?(Math.random()-.5)*G.intensity*8:0;
  ctx.save();ctx.translate(shX,shY);
  drawBg();drawPaths();WAYPOINTS.forEach(drawBody);
  if(!(G.active&&G.phase==='flash'))drawShip();
  ctx.restore();
  if(G.active)renderGlitch();
}
loop();
</script>
